services:
  postgres:
    image: postgres:16-alpine
    container_name: ringer_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ringer_db}
      POSTGRES_USER: ${POSTGRES_USER:-ringer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ringer_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ringer_user} -d ${POSTGRES_DB:-ringer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ringer_postgres_data
